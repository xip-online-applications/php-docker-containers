name: Build the PHP 7.4 CVE image.

# One-off build of src/legacy/7.4: PHP 7.4 from php-src branch PHP-7.4-CVE-2026-109618-109619.
# It is not part of the branch, main or release builds; start it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/xip-online-applications/php-docker-containers/php-7.4

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        target: [cli, fpm]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Read version
        run: src/legacy/7.4/version.sh >> "$GITHUB_ENV"

      - name: Build
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --target ${{ matrix.target }}
          --tag ${{ env.IMAGE }}:${{ matrix.target }}-${{ env.VERSION }}-${{ matrix.arch }}
          --push
          src/legacy/7.4

  manifest:
    name: join architectures
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Read version
        run: src/legacy/7.4/version.sh >> "$GITHUB_ENV"

      # Tags <target>-<version> (e.g. fpm-7.4.34-dev-712e60f) and the moving <target> tag.
      - name: Join architectures
        run: |
          for target in cli fpm; do
            docker buildx imagetools create \
              --tag "$IMAGE:$target-$VERSION" \
              --tag "$IMAGE:$target" \
              "$IMAGE:$target-$VERSION-amd64" "$IMAGE:$target-$VERSION-arm64"
          done
